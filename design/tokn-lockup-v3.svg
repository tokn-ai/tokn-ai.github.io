  viewBox="0 0 760 256"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">tokn-ai logo</title>
  <desc id="description">
    The tokn axis icon beside the tokn wordmark with red superscript ai.
  </desc>

  <g transform="translate(0 0)">
    <g
