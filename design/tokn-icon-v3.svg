<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">tokn axis icon</title>
  <desc id="description">
    A Cartesian axis with o at the origin, n beyond the positive x-axis,
    k beside the positive y-axis, and a large t in the first quadrant.
  </desc>

  <g
    fill="none"
    stroke="#111111"
    stroke-linecap="square"
    stroke-linejoin="miter"
    stroke-width="8"
  >
    <path d="M24 152H210" />
    <path d="M82 230V36" />
    <path d="m196 138 14 14-14 14" />
    <path d="m68 50 14-14 14 14" />
  </g>

  <circle cx="82" cy="152" r="17" fill="#fffdf8" />

  <g
    fill="#111111"
    font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace"
    font-weight="600"
  >
    <text x="82" y="160" font-size="30" text-anchor="middle">o</text>
    <text x="224" y="181" font-size="30">n</text>
    <text x="105" y="48" font-size="30">k</text>
    <text x="145" y="121" font-size="72" text-anchor="middle">t</text>
  </g>
</svg>
